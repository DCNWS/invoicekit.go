# EN 16931 e-invoice validation as a single CI step. Composite on purpose: the
# only artefact is a static binary downloaded from our own releases, so there is
# no container image to keep patched and no toolchain to wait for.
name: invoicekit
description: Validate CII and UBL e-invoices against EN 16931, with XRechnung CIUS or Peppol BIS on top. No Java.
author: DCNWS

inputs:
  files:
    description: Space separated files or globs to check, relative to the workspace.
    required: false
    default: "*.xml"
  cius:
    description: >-
      Country or network rule set to check on top of EN 16931, e.g. xrechnung.
      Empty means EN 16931 alone; `einv cius` lists what is embedded.
    required: false
    default: ""
  profile:
    description: >-
      Published rule-set bundle to use instead of our own EN 16931 artefacts,
      e.g. peppol. Empty means our own; `einv profile` lists what is embedded.
    required: false
    default: ""
  fail-on:
    description: >-
      When the step fails: "fatal" for fatal findings only, "any" for warnings
      as well, "never" to annotate without failing the job.
    required: false
    default: fatal
  version:
    description: >-
      Release tag to take the binary from, e.g. v0.2.5. Empty means the latest
      release. Pin it in anything you depend on.
    required: false
    default: ""

outputs:
  files:
    description: How many documents were checked.
    value: ${{ steps.report.outputs.files }}
  fatal:
    description: How many fatal findings the documents produced.
    value: ${{ steps.report.outputs.fatal }}
  warn:
    description: How many warnings the documents produced.
    value: ${{ steps.report.outputs.warn }}
  engine:
    description: Which release of the engine produced this verdict.
    value: ${{ steps.report.outputs.engine }}
  rule_sets:
    description: Which rule-set releases the verdict came from, e.g. "CII 1.3.17; UBL 1.3.17; CIUS xrechnung 2.6.0".
    value: ${{ steps.report.outputs.rule_sets }}

runs:
  using: composite
  steps:
    - name: Fetch the validator
      shell: bash
      run: sh "$GITHUB_ACTION_PATH/action/fetch.sh" "${{ inputs.version }}"
    - name: Check the documents
      id: report
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        CIUS: ${{ inputs.cius }}
        PROFILE: ${{ inputs.profile }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -uo pipefail
        # GitHub runs every step with bash -e, and einv exits 1 when a document
        # has findings: that is the answer, not a failure. Whether the step
        # fails is report.mjs's decision, from fail-on.
        set +e
        args=(-json -max -1)
        [ -z "$CIUS" ] || args+=(-cius "$CIUS")
        [ -z "$PROFILE" ] || args+=(-profile "$PROFILE")
        # shellcheck disable=SC2086  # the input is a list of globs on purpose
        einv validate "${args[@]}" $FILES > "$RUNNER_TEMP/report.json"
        status=$?
        # The same binary reports which rule sets it carries, so the verdict and
        # its provenance cannot drift apart. Failure here is not fatal: the
        # verdict above is the answer, the citation is the receipt.
        einv artefacts -json > "$RUNNER_TEMP/artefacts.json" || true
        if [ "$status" -gt 1 ]; then
          echo "::error::einv could not run (exit $status): check the files input"
          exit "$status"
        fi
        node "$GITHUB_ACTION_PATH/action/report.mjs" "$RUNNER_TEMP/report.json" "$FAIL_ON" "$RUNNER_TEMP/artefacts.json"

branding:
  icon: file-text
  color: blue
