name: ci
on:
  push:
    branches: [main]
    # A tag is exactly the moment the version string stops being a detail, so
    # the release itself is what CI checks.
    tags: ['v*']
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, so the step below can tell which release this commit is, if any.
          fetch-depth: 0
      # The version string is what the CLI, the WebAssembly and the HTTP service
      # report, and it is a constant rather than something read from the tag at
      # build time. That is only honest if the two are kept in step, which they
      # were not for v0.2.0: a site quoting go.mod said v0.2.0 while the engine
      # it had loaded introduced itself as 0.1.0.
      - name: the release tag agrees with the version the binaries report
        run: |
          const=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' einvoice.go)
          test -n "$const" || { echo "::error=no Version constant in einvoice.go"; exit 1; }
          tag=$(git tag --points-at HEAD --sort=-v:refname | grep -E '^v[0-9]' | head -1)
          if [ -n "$tag" ]; then
            test "${tag#v}" = "$const" || { echo "::error=$tag disagrees with einvoice.Version ($const)"; exit 1; }
          fi
      # The Go version is read from go.mod, never written here: a pinned
      # version here silently rots, and a version bump that has not been
      # reviewed on this corpus is exactly what should fail loudly.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      # The repository is also a GitHub Action, and an action that nobody runs
      # is an action that is broken. `uses: ./` runs this commit's action.yml on
      # the runner, against the sample documents in the repository.
      - name: the action validates the sample documents
        id: selftest
        uses: ./
        with:
          # Pinned, deliberately: an action that tests whatever the latest
          # release happens to be cannot assert a finding count. The pin lags
          # the version bump by one commit, because at the moment the tag is
          # cut the assets it downloads do not exist yet.
          files: testdata/samples/*.xml
          cius: xrechnung
          fail-on: never
          version: v0.2.8
      - name: and reports what it found
        run: |
          # The counts are an assertion, not a log line. They hold for the
          # pinned release the step below downloads — the action can only take a
          # binary from a published release, so the self-test is a test of the
          # released engine, and bumping the pin is the decision that moves them.
          # (This commit's own engine is covered by go test above.)
          got="files=${{ steps.selftest.outputs.files }} fatal=${{ steps.selftest.outputs.fatal }} warn=${{ steps.selftest.outputs.warn }}"
          want="files=3 fatal=7 warn=6"
          # The verdict is only reviewable if it names what it was judged
          # against, so the citation is asserted like the counts are: an Action
          # that quietly stopped citing its artefacts has become unverifiable.
          test "$got" = "$want" || { echo "::error::the action reported [$got], expected [$want]"; exit 1; }
          echo "$got"
          cite="engine=${{ steps.selftest.outputs.engine }} rule_sets=${{ steps.selftest.outputs.rule_sets }}"
          wantcite="engine=0.2.8 rule_sets=CII 1.3.17, UBL 1.3.17; CIUS xrechnung 2.6.0, for XRechnung 3.0.2"
          test "$cite" = "$wantcite" || { echo "::error::the action cited [$cite], expected [$wantcite]"; exit 1; }
          echo "$cite"
      # A gate that only ever reports is not a gate. Both directions are
      # checked here, against the same documents, because the failure path is
      # the one a user actually depends on and the one easiest to break.
      - name: the gate passes when nothing fatal is in scope
        uses: ./
        with:
          # cii-xrechnung.xml carries warnings and no fatal findings, which is
          # exactly the case fail-on: fatal is meant to let through.
          files: testdata/samples/cii-xrechnung.xml
          cius: xrechnung
          fail-on: fatal
          version: v0.2.8
      - name: the gate fails when a fatal finding is in scope
        id: gatefail
        uses: ./
        continue-on-error: true
        with:
          files: testdata/samples/ubl-min.xml
          cius: xrechnung
          fail-on: fatal
          version: v0.2.8
      - name: and says so in the right direction
        run: |
          test "${{ steps.gatefail.outcome }}" = failure || {
            echo "::error::fail-on: fatal let a document with 6 fatal findings through"
            exit 1
          }
      - name: webassembly build
        run: GOOS=js GOARCH=wasm go build -o /tmp/einv.wasm ./cmd/einv-wasm

  corpora:
    # the suites that skip without an upstream corpus, run here so a rule-set
    # regression cannot slip through on the reduced fixtures alone
    runs-on: ubuntu-latest
    steps:
      # The corpora go one level above the checkout, which is where the suites
      # look for them when EINVOICE_REF and friends are unset.
      - uses: actions/checkout@v7
      - run: git clone --depth 1 https://github.com/ConnectingEurope/eInvoicing-EN16931.git ../ref-en16931
      # Pinned: the expected-rule-count tests below are assertions about this
      # ref of the bis spec, so cloning its default branch would let an
      # upstream release change what "correct" means without a commit here.
      - run: git clone --depth 1 --branch 3.0.21 https://github.com/OpenPeppol/peppol-bis-invoice-3.git ../ref-peppol
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...
