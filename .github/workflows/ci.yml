name: ci
on:
  push:
    branches: [main]
    # A tag is exactly the moment the version string stops being a detail, so
    # the release itself is what CI checks.
    tags: ['v*']
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, so the step below can tell which release this commit is, if any.
          fetch-depth: 0
      # The version string is what the CLI, the WebAssembly and the HTTP service
      # report, and it is a constant rather than something read from the tag at
      # build time. That is only honest if the two are kept in step, which they
      # were not for v0.2.0: a site quoting go.mod said v0.2.0 while the engine
      # it had loaded introduced itself as 0.1.0.
      - name: the release tag agrees with the version the binaries report
        run: |
          const=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' einvoice.go)
          test -n "$const" || { echo "::error=no Version constant in einvoice.go"; exit 1; }
          tag=$(git tag --points-at HEAD --sort=-v:refname | grep -E '^v[0-9]' | head -1)
          if [ -n "$tag" ]; then
            test "${tag#v}" = "$const" || { echo "::error=$tag disagrees with einvoice.Version ($const)"; exit 1; }
          fi
      # The Go version is read from go.mod, never written here: a pinned
      # version here silently rots, and a version bump that has not been
      # reviewed on this corpus is exactly what should fail loudly.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      # The repository is also a GitHub Action, and an action that nobody runs
      # is an action that is broken. `uses: ./` runs this commit's action.yml on
      # the runner, against the sample documents in the repository.
      - name: the action validates the sample documents
        id: selftest
        uses: ./
        with:
          files: testdata/samples/*.xml
          cius: xrechnung
          fail-on: never
      - name: and reports what it found
        run: |
          echo "documents=${{ steps.selftest.outputs.files }}"
      - name: webassembly build
        run: GOOS=js GOARCH=wasm go build -o /tmp/einv.wasm ./cmd/einv-wasm

  corpora:
    # the suites that skip without an upstream corpus, run here so a rule-set
    # regression cannot slip through on the reduced fixtures alone
    runs-on: ubuntu-latest
    steps:
      # The corpora go one level above the checkout, which is where the suites
      # look for them when EINVOICE_REF and friends are unset.
      - uses: actions/checkout@v7
      - run: git clone --depth 1 https://github.com/ConnectingEurope/eInvoicing-EN16931.git ../ref-en16931
      # Pinned: the expected-rule-count tests below are assertions about this
      # ref of the bis spec, so cloning its default branch would let an
      # upstream release change what "correct" means without a commit here.
      - run: git clone --depth 1 --branch 3.0.21 https://github.com/OpenPeppol/peppol-bis-invoice-3.git ../ref-peppol
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...
